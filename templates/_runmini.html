{# 跨頁共用的「右下角執行進度」。

   量測跑在 Flask 的工作執行緒裡,瀏覽器只是看板 —— 換頁、關頁都不會讓它停。
   但先前只有 /acqua 這一頁有進度視窗,所以一換頁畫面就空了,看起來像停了。
   這個 partial 讓進度跟著人走。

   頁面自己已經有進度視窗的話,設 window.__hasRunMini = true 就不會疊上來。 #}
<style>
  #rmini { position:fixed; right:18px; bottom:18px; z-index:200; display:none;
           width:250px; border-radius:12px; cursor:pointer;
           background:var(--card, #fff); color:var(--fg, #111);
           border:1px solid var(--line, #e3e3e8);
           box-shadow:0 10px 34px #0000002e; font-size:13px; }
  #rmini.on { display:block; }
  #rmini .h { display:flex; align-items:center; gap:8px;
              padding:10px 12px 8px; font-weight:600; }
  #rmini .h .d { width:9px; height:9px; border-radius:50%; flex:none;
                 background:#e8a70a; animation:rmp 1.1s infinite; }
  #rmini.stopping .h .d { background:#d24b4b; }
  @keyframes rmp { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  #rmini .h span { flex:1; }
  #rmini .b { padding:0 12px 12px; }
  #rmini .n { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  #rmini .n small { font-size:12px; font-weight:400; color:var(--muted, #8a8a93); }
  #rmini .bar { height:6px; border-radius:4px; margin:8px 0 6px;
                background:var(--line, #e9e9ee); overflow:hidden; }
  #rmini .bar i { display:block; height:100%; background:#e8a70a; transition:width .3s; }
  #rmini .s { display:flex; gap:10px; font-size:11px; color:var(--muted, #8a8a93); }
  #rmini .s b { font-variant-numeric:tabular-nums; }
  #rmini .s .p b { color:var(--ok, #2e9e5b); }
  #rmini .s .f b { color:var(--bad, #d24b4b); }
  #rmini .t { font-size:11px; color:var(--muted, #8a8a93); margin-top:5px;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

<div id="rmini" title="點一下回到測試頁">
  <div class="h"><i class="d"></i><span id="rm-title">測試進行中</span></div>
  <div class="b">
    <div class="n"><span id="rm-i">0</span><small> / <span id="rm-n">0</span></small></div>
    <div class="bar"><i id="rm-bar" style="width:0%"></i></div>
    <div class="s">
      <span class="p">PASS <b id="rm-p">0</b></span>
      <span class="f">FAIL <b id="rm-f">0</b></span>
      <span id="rm-eta"></span>
    </div>
    <div class="t" id="rm-name"></div>
  </div>
</div>

<script>
(function () {
  if (window.__hasRunMini) return;          // 這一頁自己有進度視窗
  window.__hasRunMini = true;

  const el = (id) => document.getElementById(id);
  const box = el('rmini');
  box.onclick = () => { location.href = '/acqua/'; };

  let t0 = null, seen = 0;

  async function tick() {
    let s;
    try {
      s = await (await fetch('/acqua/api/status')).json();
    } catch (e) { return; }

    // 這一頁自己開著大的進度框時就不要疊兩層
    const own = document.querySelector('#runov.on');

    // 宿主頁面可以提供自己的階段 —— 例如序列在「移動治具」那幾秒,
    // 伺服器沒有量測在跑,但整件事還沒結束。
    const host = (typeof window.__miniInfo === 'function')
      ? window.__miniInfo() : null;
    const active = (host && host.active) || !!s.running;

    box.classList.toggle('on', active && !own);
    box.classList.toggle('stopping', !!s.cancel_requested);
    if (!active) { t0 = null; return; }

    // 宿主說了算的階段(沒有伺服器端進度可用)
    if (host && host.active && !s.running) {
      el('rm-title').textContent = host.title || '進行中';
      el('rm-i').textContent = host.index || 0;
      el('rm-n').textContent = host.total || 0;
      el('rm-bar').style.width = (host.percent || 0) + '%';
      el('rm-p').textContent = host.passed || 0;
      el('rm-f').textContent = host.failed || 0;
      el('rm-name').textContent = host.detail || '';
      el('rm-eta').textContent = '';
      t0 = null;
      return;
    }

    const cur = s.current || {};
    const total = cur.total || (s.summary ? s.summary.total : 0) || 0;
    const done = s.summary ? s.summary.total : 0;
    if (t0 === null) { t0 = Date.now(); seen = done; }

    el('rm-title').textContent = s.cancel_requested ? '停止中…'
      : ((host && host.title) || '測試進行中');
    el('rm-i').textContent = cur.index || done;
    el('rm-n').textContent = total || '?';
    el('rm-bar').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
    el('rm-p').textContent = s.summary ? s.summary.passed : 0;
    el('rm-f').textContent = s.summary ? s.summary.failed : 0;
    el('rm-name').textContent =
      ((host && host.detail) ? host.detail + ' ・ ' : '') + (cur.title || '');

    // 預估剩餘:用這一頁看到的區間去算,不需要後端配合
    const dn = done - seen;
    if (dn > 0 && total > done) {
      const per = (Date.now() - t0) / dn / 1000;
      const left = Math.round(per * (total - done));
      el('rm-eta').textContent = left > 60
        ? '約剩 ' + Math.floor(left / 60) + ' 分 ' + (left % 60) + ' 秒'
        : '約剩 ' + left + ' 秒';
    }
  }

  tick();
  setInterval(tick, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
